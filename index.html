    <!--
      Preloads the dark portrait because dark is the default theme, so it's what
      a first-time visitor gets. Someone with light saved fetches the other one
      normally — worth it to keep the common path fast rather than preloading
      both and wasting a request on every visit.

      Inserted by script rather than declared, because the portrait is the LCP
      element on / only: /hire/* never renders it, and a client opening that
      page from a proposal would download 65 kB for nothing.
    -->
    <script>
      if (!location.pathname.startsWith("/hire")) {
        document.head.appendChild(
          Object.assign(document.createElement("link"), {
            rel: "preload",
            as: "image",
            href: "/photos/ageu-hero.webp",
            type: "image/webp",
            fetchPriority: "high",
          }),
        );
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <!--
      Structured data. Meta tags describe the page; this describes the person,
      so a search engine can tell that "Ageu Menezes" is a named professional
      with these profiles rather than a phrase that appears in the text. sameAs
      is what ties this page to the GitHub and LinkedIn accounts as one identity.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Person",
            "@id": "https://ageumenezes-dp-2.vercel.app/#ageu",

            "jobTitle": "Front-End Developer",
            "description": "Front-end developer who ships full products — React, Next.js and TypeScript, with the backend and DevOps skills to take an idea from design to production.",
            "url": "https://ageumenezes-dp-2.vercel.app/",
            "image": "https://ageumenezes-dp-2.vercel.app/photos/ageu-hero.webp",
            "email": "mailto:ageumenezes23@gmail.com",
            "address": {
              "@type": "PostalAddress",
              "addressRegion": "Ceará",
              "addressCountry": "BR"
            },
            "knowsLanguage": ["pt-BR", "en"],
            "knowsAbout": [
              "React",
              "Next.js",
              "TypeScript",
              "Node.js",
              "Tailwind CSS",
              "PostgreSQL",
              "Playwright",

            ],

            "publisher": { "@id": "https://ageumenezes-dp-2.vercel.app/#ageu" }
          }
        ]
      }
    </script>
